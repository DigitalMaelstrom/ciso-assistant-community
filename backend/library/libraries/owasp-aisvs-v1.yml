locale: en
ref_id: OWASP-AISVS-1.0
name: OWASP AI Security Verification Standard v1.0.0
description:
copyright: Copyright © 2025-2026 The AISVS Project.
version: 1.0
publication_date: 2026-06-24
provider: OWASP
packager: DigitalMaelstrom
objects:
  frameworks:
    urn: urn:digitalmaelstrom:risk:framework:owasp-aisvs-1.0
    ref_id: OWASP-AISVS-1.0
    name: OWASP AI Security Verification Standard v1.0
    description: 
    implementation_groups_definition:
    - ref_id: '1'
      name: Level 1
      description: This level contains the minimum requirements to consider when securing an AI system and represents a critical starting point.
    - ref_id: '2'
      name: Level 2
      description: Most AI systems should be striving to achieve this level of security.
    - ref_id: '3'
      name: Level 3
      description: This level should be the goal for AI systems looking to demonstrate the highest levels of security.
    requirement_nodes:
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01
      assessable: false
      depth: 1
      ref_id: C1
      name: "Training Data Integrity & Traceability"
      description: "This chapter addresses protecting the integrity and traceability of training data as it is sourced, handled, and maintained."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01
      ref_id: C1.1
      name: "Training Data Origin & Data Security"
      description: "Training data origin and security are critical to the trustworthiness of any AI system. Datasets must be sourced from verifiable origins, tracked across their full lifecycle, and protected against tampering, corruption, and poisoning so that unauthorized modification can be detected."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1
      ref_id: C1.1.1
      name: "Training Data Includes Only Required Features"
      description: "Verify that training data includes only features, attributes, and fields required for the model's stated purpose."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1
      ref_id: C1.1.2
      name: "Training Data Source Inventory"
      description: "Verify that an up-to-date inventory is kept of every training-data source, including its origin, responsible party, license, collection method, intended use constraints, and processing history."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1
      ref_id: C1.1.3
      name: "Data Integrity for Training Data"
      description: "Verify that data integrity is provided when training data is stored and transferred."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1.4
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1
      ref_id: C1.1.4
      name: "Training Data Access Controls"
      description: "Verify that integrity monitoring is applied to guard against unauthorized modifications or corruption of training data."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1.5
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.1
      ref_id: C1.1.5
      name: "Training Data Watermarking"
      description: "Verify that datasets are watermarked so their use can be attributed and any unauthorized use detected."
      implementation_groups: ['3']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.2
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01
      ref_id: C01.2
      name: "C1.2 Data Labeling and Annotation Security"
      description: "Labeling and annotation processes must be protected against unauthorized modification, data leakage, and integrity compromise. Annotation platforms should enforce access control, preserve auditability, and protect labeling artifacts and sensitive label content throughout the training pipeline."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.2.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.2
      ref_id: C1.2.1
      name: "Labeling Platform Access Controls"
      description: "Verify that labeling platforms enforce access controls that restrict who can create, modify, or approve annotations."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.2.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.2
      ref_id: C1.2.2
      name: "Cryptographic Integrity for Labeling Artifacts"
      description: "Verify that cryptographic integrity is applied to labeling artifacts."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.2.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.2
      ref_id: C1.2.3
      name: "Sensitive Information Protection in Labels"
      description: "Verify that sensitive information in labels is redacted, anonymized, or encrypted before being used in any labeling artifact."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01
      ref_id: C01.3
      name: "C1.3 Training Data Quality and Security Assurance"
      description: "Quality and security assurance controls help detect corruption, poisoning, labeling errors, and exploitable dataset patterns before they affect model behavior. Pipelines should combine automated validation, poisoning detection, label quality checks, and bias analysis."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3
      ref_id: C1.3.1
      name: "Poisoning Detection in Training Pipelines"
      description: "Verify that training and fine-tuning pipelines implement poisoning detection techniques to identify potential data poisoning or unintentional corruption in training data."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3
      ref_id: C1.3.2
      name: "Automatic Label Quality Checks"
      description: "Verify that automatically generated labels are subject to confidence thresholds and consistency checks to detect misleading or low-confidence labels."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3
      ref_id: C1.3.3
      name: "Bias Analysis in Training Data"
      description: "Verify that models used in security-relevant decisions are evaluated for bias patterns."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3.4
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3
      ref_id: C1.3.4
      name: "Disallowed Content Detection"
      description: "Verify that disallowed content is detected and removed before training."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3.5
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c01.3
      ref_id: C1.3.5
      name: "Defenses Against Clean-Label Poisoning Attacks"
      description: "Verify that defenses against clean-label poisoning attacks are implemented."
      implementation_groups: ['3']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02
      assessable: false
      depth: 1
      ref_id: C02
      name: "C2 Input Validation"
      description: "This chapter addresses validation of all inputs as a first-line defense against prompt injection, one of the most damaging attacks on AI systems."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02
      ref_id: C02.1
      name: "C2.1 Prompt Injection Defenses"
      description: "Prompt injection is one of the top risks for AI systems, and defending against it requires a combination of pattern filters, data classifiers, and instruction hierarchy enforcement."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      ref_id: C2.1.1
      name: "Input Normalization"
      description: "Verify that input normalization is applied before tokenization or embedding."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      ref_id: C2.1.2
      name: "Encoding and Representation Smuggling Detection"
      description: "Verify that encoding and representation smuggling in inputs is detected and mitigated. Approved mitigations include canonicalization, strict schema validation, policy-based rejection, or explicit marking."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      ref_id: C2.1.3
      name: "Untrusted Input Handling"
      description: "Verify that all inputs that could steer model behavior are treated as untrusted and screened by a prompt injection detection ruleset or classifier, with flagged inputs blocked."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1.4
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      ref_id: C2.1.4
      name: "2.1.4"
      description: "Verify that input length controls prevent content from exceeding the context window. The controls must reject inputs that exceed token limits rather than truncating them."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1.5
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      ref_id: C2.1.5
      name: "2.1.5"
      description: "Verify that the system implements a character set restriction for all inputs. The restriction must use an allow-list approach that permits only characters that are explicitly required."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1.6
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      ref_id: C2.1.6
      name: "2.1.6"
      description: "Verify that the system enforces an instruction hierarchy in which system and developer messages override user instructions and other untrusted inputs, even after user instructions have been processed."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1.7
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      ref_id: C2.1.7
      name: "2.1.7"
      description: "Verify that reserved special tokens are encoded as literal characters and cannot be injected into the model context."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1.8
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.1
      ref_id: C2.1.8
      name: "2.1.8"
      description: "Verify that the system can detect many-shot jailbreaking patterns."
      implementation_groups: ['3']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02
      ref_id: C02.2
      name: "C2.2 Content & Policy Screening"
      description: "Syntactically valid prompts may still request disallowed content such as policy-violating instructions, harmful material, or restricted information. Input-side content screening prevents such prompts from reaching the model."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2
      ref_id: C2.2.1
      name: "2.2.1"
      description: "Verify that every prompt is scored by a content classifier for violence, self-harm, hate, and sexual content against configurable thresholds. Prompts that exceed those thresholds are rejected or sanitized before reaching the model context."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2
      ref_id: C2.2.2
      name: "2.2.2"
      description: "Verify that prompt content classification is evaluated for unsupported languages."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2
      ref_id: C2.2.3
      name: "2.2.3"
      description: "Verify that non-text inputs (image/video/audio) are checked for adversarial perturbations, steganographic payloads, hidden or embedded content, or known attack patterns."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2.4
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c02.2
      ref_id: C2.2.4
      name: "2.2.4"
      description: "Verify that coordinated attacks spanning multiple input types (e.g., steganographic payloads in images combined with prompt injection in text) are detected and blocked."
      implementation_groups: ['3']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03
      assessable: false
      depth: 1
      ref_id: C03
      name: "C3 Model Lifecycle Management & Change Control"
      description: "This chapter addresses control of model changes so that unauthorized or unsafe modifications cannot reach production."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.1
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03
      ref_id: C03.1
      name: "C3.1 Model Authorization & Integrity"
      description: "Only authorized models with verified integrity should reach production environments."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.1.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.1
      ref_id: C3.1.1
      name: "3.1.1"
      description: "Verify that a model registry maintains an inventory of all deployed model artifacts and their origin."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.1.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.1
      ref_id: C3.1.2
      name: "3.1.2"
      description: "Verify that all model artifacts (weights, configurations, tokenizers, base models, fine-tunes, adapters, and safety/policy models) are cryptographically signed by authorized entities."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.1.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.1
      ref_id: C3.1.3
      name: "3.1.3"
      description: "Verify that model cryptographic signatures are verified at deployment admission and on load."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.2
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03
      ref_id: C03.2
      name: "C3.2 Model Validation & Testing"
      description: "Models must pass defined security and safety validations before deployment."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.2.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.2
      ref_id: C3.2.1
      name: "3.2.1"
      description: "Verify that models undergo automated input validation testing, safety evaluation testing, and output sanitization testing before deployment."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.2.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.2
      ref_id: C3.2.2
      name: "3.2.2"
      description: "Verify that models subjected to post-training quantization are re-evaluated against the same safety and alignment test suite on the compressed artifact before deployment."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.2.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.2
      ref_id: C3.2.3
      name: "3.2.3"
      description: "Verify that provider model, version, or routing changes trigger security re-evaluation before continued use."
      implementation_groups: ['3']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.3
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03
      ref_id: C03.3
      name: "C3.3 Controlled Deployment & Rollback"
      description: "Model deployments must be controlled, monitored, and reversible to support lifecycle management."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.3.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.3
      ref_id: C3.3.1
      name: "3.3.1"
      description: "Verify that production deployments implement rollout mechanisms with automated rollback triggers."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.3.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.3
      ref_id: C3.3.2
      name: "3.3.2"
      description: "Verify that rollback capabilities restore the complete model state."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.3.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.3
      ref_id: C3.3.3
      name: "3.3.3"
      description: "Verify that model versions running in parallel use isolated runtime state so that AI-specific shared resources are not shared across deployments."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.4
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03
      ref_id: C03.4
      name: "C3.4 Secure Development Practices"
      description: "Model development environments must be separated from production environments."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.4.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.4
      ref_id: C3.4.1
      name: "3.4.1"
      description: "Verify that AI-specific runtime components are not shared across environment boundaries (e.g., development, staging, production)."
      implementation_groups: ['1']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.4.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.4
      ref_id: C3.4.2
      name: "3.4.2"
      description: "Verify that model training and fine-tuning environments are isolated from production environments."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5
      assessable: false
      depth: 2
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03
      ref_id: C03.5
      name: "C3.5 Pipeline Fine-Tuning"
      description: "Fine-tuning pipelines are high-privilege operations that can alter deployed model behavior at scale. Multi-stage pipelines compound this risk because a compromise at any intermediate stage produces a subtly altered artifact that subsequent stages accept."
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5.1
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5
      ref_id: C3.5.1
      name: "3.5.1"
      description: "Verify that models used in RLHF fine-tuning are versioned and integrity-verified before use in a training run."
      implementation_groups: ['2']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5.2
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5
      ref_id: C3.5.2
      name: "3.5.2"
      description: "Verify that RLHF training stages include automated detection of reward hacking or reward model over-optimization."
      implementation_groups: ['3']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5.3
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5
      ref_id: C3.5.3
      name: "3.5.3"
      description: "Verify that in multi-stage fine-tuning pipelines, each stage's output is integrity-verified before it is consumed by the next stage."
      implementation_groups: ['3']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5.4
      assessable: true
      depth: 3
      parent_urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c03.5
      ref_id: C3.5.4
      name: "3.5.4"
      description: "Verify that fine-tuning checkpoints are registered as distinct artifacts."
      implementation_groups: ['3']
    - urn: urn:digitalmaelstrom:risk:req_node:owasp-aisvs-1.0:c04
      assessable: false
      depth: 1
      ref_id: C04
